name: Собрать APK

# Срабатывает на каждый push в любую ветку — сборка не требует Android Studio на компьютере:
# GitHub сам собирает APK на своих серверах, готовый файл кладётся в раздел "Actions" этого
# репозитория (вкладка Actions -> нужный запуск -> Artifacts внизу страницы), оттуда его можно
# скачать прямо с телефона. workflow_dispatch — чтобы можно было запустить сборку вручную
# кнопкой "Run workflow", не делая новый коммит, если просто хочется пересобрать APK заново.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Разрешить запуск gradlew
        run: chmod +x gradlew

      - name: Собрать debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Загрузить APK как Artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-driver-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
